<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kitangobrol</title>
    <link rel="icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/styles.min.css">
</head>
<body>
    <main class="centered-form">
        <section class="centered-form__box">
            <h1>ruangobrol</h1>
            <form action="/chat.html" method="get" aria-label="Form bergabung ke ruang obrol">
                <label for="username">Display name</label>
                <input id="username" type="text" name="username" placeholder="Display Name" required>

                <label for="room">Room</label>
                <input id="room" type="text" name="room" placeholder="Room" required>

                <button type="submit">Bergabung ke Chat</button>
            </form>
        </section>
    </main>
</body>
</html>
